<!DOCTYPE html>

<html>

<head>

<title>Dashboard</title>

<link rel="stylesheet" href="/static/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="nav">

<a href="/dashboard">Dashboard</a>
<a href="/alerts">Alerts</a>
<a href="/health">Health</a>

</div>

<h1>NIDS Dashboard</h1>

<div class="cards">

<div class="card">

<h3>Total Alerts</h3>

<p id="total"></p>

</div>

<div class="card">

<h3>High Severity</h3>

<p id="high"></p>

</div>

</div>

<h2>Launch Attack</h2>

<button onclick="attack(1)">Bot</button>
<button onclick="attack(2)">DDoS</button>
<button onclick="attack(3)">DoS</button>
<button onclick="attack(4)">PortScan</button>
<button onclick="attack(5)">BruteForce</button>
<button onclick="attack(6)">WebAttack</button>

<br><br>

<canvas id="chart"></canvas>

<script>

async function attack(id){

    const response = await fetch(`/api/simulate/${id}`)

    const data = await response.json()

    alert(

        "Attack: " + data.attack +

        "\nSeverity: " + data.severity +

        "\nSource IP: " + data.src_ip +

        "\nDestination IP: " + data.dst_ip

    )

    loadStats()
}

async function loadStats(){

    const response = await fetch('/api/stats')

    const data = await response.json()

    document.getElementById("total").innerText =
        data.total_alerts

    document.getElementById("high").innerText =
        data.high_alerts

    chart.data.datasets[0].data = [

        data.high_alerts,
        data.medium_alerts,
        data.low_alerts

    ]

    chart.update()
}

const ctx = document.getElementById('chart')

const chart = new Chart(ctx, {

    type: 'pie',

    data: {

        labels: ['High', 'Medium', 'Low'],

        datasets: [{

            data: [0,0,0]

        }]
    }
})

loadStats()

</script>

</body>

</html>
