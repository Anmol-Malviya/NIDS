<!DOCTYPE html>
<html>
<head>
<title>Login</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4; margin: 0;">

<div style="
    background: white;
    width: 320px;
    padding: 30px;
    margin: 100px auto;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
">

    <h1 style="margin-bottom: 20px; color: #333;">NIDS Login</h1>

    <input type="text" placeholder="Username" 
        style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px;">
    
    <input type="password" placeholder="Password" 
        style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px;">

    <br><br>

    <a href="/dashboard" style="text-decoration: none;">
        <button style="
            width: 100%;
            padding: 12px;
            background: #195602;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        ">
          Login
        </button>
    </a>

</div>

</body>
</html>
