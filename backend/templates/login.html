<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIDS — Login</title>
  <meta name="description" content="Network Intrusion Detection System — Secure Login">
  <link rel="stylesheet" href="/static/nids.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🛡️</div>
      <div class="login-logo-title">NIDS Monitor</div>
      <div class="login-logo-sub">Network Intrusion Detection System</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input class="form-input" id="username" type="text" placeholder="admin" autocomplete="username">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <a href="/dashboard" class="btn-login" id="login-btn">Access Dashboard</a>

    <div class="login-hint">Senior Project · Karabük University · Computer Engineering</div>
  </div>
</div>
</body>
</html>
